dos (Error 33, Cause 4) pusieron el módulo en modo de seguridad.","cause_pt":"Erros repetidos (Error 33, Cause 4) colocaram o módulo em modo de segurança.","fix_es":"Apague y vuelva a encender el sistema para restablecer la falla. Luego busque la causa original en la información de diagnóstico.","fix_pt":"Desligue e ligue o sistema para resetar a falha. Depois procure a causa original nas informações de diagnóstico."}],"mod_en":"Spinner Spreader Module"},{"id":46,"msg_en":"Spinner 2 conveyor control valve faulted. Cycle power on the system to reset.","module_es":"Módulo de Esparcidora de Discos","module_pt":"Módulo de Distribuidor a Lanço (Discos)","msg_es":"Válvula de control del disco 2 en falla. Apague y vuelva a encender el sistema para restablecer.","msg_pt":"Válvula de controle do disco 2 em falha. Desligue e ligue o sistema para resetar.","nums":["37"],"causes":[{"cause_es":"Errores repetidos (Error 37, Cause 3) pusieron el módulo en modo de seguridad.","cause_pt":"Erros repetidos (Error 37, Cause 3) colocaram o módulo em modo de segurança.","fix_es":"Apague y vuelva a encender el sistema para restablecer la falla. Luego busque la causa original en la información de diagnóstico (Error 37, Cause 5).","fix_pt":"Desligue e ligue o sistema para resetar a falha. Depois procure a causa original nas informações de diagnóstico (Error 37, Cause 5)."},{"cause_es":"Errores repetidos (Error 37, Cause 4) pusieron el módulo en modo de seguridad.","cause_pt":"Erros repetidos (Error 37, Cause 4) colocaram o módulo em modo de segurança.","fix_es":"Apague y vuelva a encender el sistema para restablecer la falla. Luego busque la causa original en la información de diagnóstico (Error 37, Cause 6).","fix_pt":"Desligue e ligue o sistema para resetar a falha. Depois procure a causa original nas informações de diagnóstico (Error 37, Cause 6)."}],"mod_en":"Spinner Spreader Module"},{"id":47,"msg_en":"The conveyor 2 control valve was drawing over 2A when not activated.","module_es":"Módulo de Esparcidora de Discos","module_pt":"Módulo de Distribuidor a Lanço (Discos)","msg_es":"La válvula de control de la cinta 2 consumía más de 2A cuando no estaba activada.","msg_pt":"A válvula de controle da esteira 2 consumia mais de 2A quando não estava ativada.","nums":["34"],"causes":[{"cause_es":"Falla del driver (salida) del módulo.","cause_pt":"Falha no driver (saída) do módulo.","fix_es":"Reemplace el módulo. Para confirmar: con la válvula de control desactivada, mida el voltaje de salida del módulo; debe ser cero.","fix_pt":"Substitua o módulo. Para confirmar: com a válvula de controle desativada, meça a tensão de saída do módulo; deve ser zero."}],"mod_en":"Spinner Spreader Module"},{"id":48,"msg_en":"Fan Frame Actuator Not Responding. Check your equipment.","module_es":"Actuador Lineal","module_pt":"Atuador Linear","msg_es":"El actuador del soporte de los discos (fan frame) no responde. Revise su equipo.","msg_pt":"O atuador do suporte dos discos (fan frame) não responde. Verifique seu equipamento.","nums":["43","44"],"causes":[{"cause_es":"El módulo no logra mover el soporte de los discos (fan frame) a la posición ordenada.","cause_pt":"O módulo não consegue mover o suporte dos discos (fan frame) para a posição comandada.","fix_es":"Verifique que el actuador y el sensor de posición estén bien fijados mecánicamente al equipo.","fix_pt":"Verifique se o atuador e o sensor de posição estão bem fixados mecanicamente no equipamento."}],"mod_en":"Linear Actuator"},{"id":49,"msg_en":"Fan frame over current condition. Check cabling and actuator.","module_es":"Actuador Lineal","module_pt":"Atuador Linear","msg_es":"Sobrecorriente en el soporte de los discos (fan frame). Revise el cableado y el actuador.","msg_pt":"Sobrecorrente no suporte dos discos (fan frame). Verifique a fiação e o atuador.","nums":["41"],"causes":[{"cause_es":"El lado alto de el soporte de los discos (fan frame) consumía más de 15 A mientras se accionaba.","cause_pt":"O lado alto de o suporte dos discos (fan frame) consumia mais de 15 A enquanto era acionado.","fix_es":"Verifique que el soporte de los discos (fan frame) se mueva libremente. Revise el cableado del actuador por cortocircuitos. También el motor del actuador lineal puede estar fallando y consumiendo demasiada corriente.","fix_pt":"Verifique se o suporte dos discos (fan frame) se move livremente. Verifique a fiação do atuador quanto a curtos. O motor do atuador linear também pode estar falhando e consumindo corrente demais."},{"cause_es":"El lado bajo de el soporte de los discos (fan frame) consumía más de 15 A mientras se accionaba.","cause_pt":"O lado baixo de o suporte dos discos (fan frame) consumia mais de 15 A enquanto era acionado.","fix_es":"Verifique que el soporte de los discos (fan frame) se mueva libremente. Revise el cableado del actuador por cortocircuitos. También el motor del actuador lineal puede estar fallando y consumiendo demasiada corriente.","fix_pt":"Verifique se o suporte dos discos (fan frame) se move livremente. Verifique a fiação do atuador quanto a curtos. O motor do atuador linear também pode estar falhando e consumindo corrente demais."},{"cause_es":"El driver del lado alto de el soporte de los discos (fan frame) consumía más de 2 A sin estar accionado.","cause_pt":"O driver do lado alto de o suporte dos discos (fan frame) consumia mais de 2 A sem estar acionado.","fix_es":"Falla del driver del lado alto del módulo. Reemplace el módulo. Para confirmar: con la salida desactivada, mida el voltaje de salida del módulo; debe ser cero.","fix_pt":"Falha no driver do lado alto do módulo. Substitua o módulo. Para confirmar: com a saída desativada, meça a tensão de saída do módulo; deve ser zero."},{"cause_es":"El driver del lado bajo de el soporte de los discos (fan frame) consumía más de 2 A sin estar accionado.","cause_pt":"O driver do lado baixo de o suporte dos discos (fan frame) consumia mais de 2 A sem estar acionado.","fix_es":"Falla del driver del lado bajo del módulo. Reemplace el módulo. Para confirmar: con la salida desactivada, mida el voltaje de salida del módulo; debe ser cero.","fix_pt":"Falha no driver do lado baixo do módulo. Substitua o módulo. Para confirmar: com a saída desativada, meça a tensão de saída do módulo; deve ser zero."}],"mod_en":"Linear Actuator"},{"id":50,"msg_en":"Fan Frame unplanned correction.","module_es":"Actuador Lineal","module_pt":"Atuador Linear","msg_es":"Corrección no prevista del soporte de los discos (fan frame).","msg_pt":"Correção não prevista do suporte dos discos (fan frame).","nums":["45","46"],"causes":[{"cause_es":"El módulo tuvo que reajustar el soporte de los discos para mantener la posición ordenada.","cause_pt":"O módulo teve que reajustar o suporte dos discos para manter a posição comandada.","fix_es":"Verifique que no haya demasiado juego (holgura) en la unión mecánica entre el actuador, el sensor de posición y el soporte de los discos.","fix_pt":"Verifique se não há folga demais na ligação mecânica entre o atuador, o sensor de posição e o suporte dos discos."}],"mod_en":"Linear Actuator"},{"id":51,"msg_en":"Feed gate over current condition. Check cabling and actuator.","module_es":"Actuador Lineal","module_pt":"Atuador Linear","msg_es":"Sobrecorriente en la compuerta de alimentación (feed gate). Revise el cableado y el actuador.","msg_pt":"Sobrecorrente na comporta de alimentação (feed gate). Verifique a fiação e o atuador.","nums":["42"],"causes":[{"cause_es":"El lado alto de la compuerta de alimentación (feed gate) consumía más de 15 A mientras se accionaba.","cause_pt":"O lado alto de a comporta de alimentação (feed gate) consumia mais de 15 A enquanto era acionado.","fix_es":"Verifique que la compuerta de alimentación (feed gate) se mueva libremente. Revise el cableado del actuador por cortocircuitos. También el motor del actuador lineal puede estar fallando y consumiendo demasiada corriente.","fix_pt":"Verifique se a comporta de alimentação (feed gate) se move :[{"cause_es":"Se detectó un error de hardware al abrir la válvula (por temperatura, sobrecorriente, etc.).","cause_pt":"Erro de hardware detectado ao abrir a válvula (por temperatura, sobrecorrente etc.).","fix_es":"Revise si el cable de apertura está en corto a masa o el cable de cierre en corto a positivo. Si el cableado está bien, el módulo puede estar en un lugar muy caliente o estar fallando. Verifique también las conexiones de alimentación y masa del módulo.","fix_pt":"Verifique se o fio de abertura está em curto com o terra ou o fio de fechamento em curto com o positivo. Se o cabeamento estiver bom, o módulo pode estar em local muito quente ou com defeito. Verifique também as conexões de alimentação e terra do módulo."}],"mod_en":"Stepper Spinner Spreader Module"},{"id":61,"msg_en":"Spinner 1 conveyor driver failure. Check module for proper operation.","module_es":"Módulo de esparcidora de discos (Stepper Spinner)","module_pt":"Módulo de distribuidor de discos (Stepper Spinner)","msg_es":"Falla del driver de la cinta del disco 1. Verifique que el módulo funcione correctamente.","msg_pt":"Falha do driver da esteira do disco 1. Verifique se o módulo funciona corretamente.","nums":["89","90"],"causes":[{"cause_es":"La válvula de control del disco 1 consumía más de 2A estando desactivada.","cause_pt":"A válvula de controle do disco 1 consumia mais de 2A estando desativada.","fix_es":"Indica falla del driver: reemplace el módulo. Para confirmar, mida el voltaje de salida del módulo con la válvula desactivada; debe ser cero.","fix_pt":"Indica falha do driver: substitua o módulo. Para confirmar, meça a tensão de saída do módulo com a válvula desativada; deve ser zero."}],"mod_en":"Stepper Spinner Spreader Module"},{"id":62,"msg_en":"Spinner 1 conveyor over current condition. Check cabling and control valve for proper operation.","module_es":"Módulo de esparcidora de discos (Stepper Spinner)","module_pt":"Módulo de distribuidor de discos (Stepper Spinner)","msg_es": or de sementes sem fluxo","nums":["164"],"causes":[{"cause_es":"Uno o más sensores de semillas no detectan paso de semillas.","cause_pt":"Um ou mais sensores de sementes não detectam passagem de sementes.","fix_es":"Revise el sensor del tubo de semillas y la línea para ver por qué no se cuentan semillas.","fix_pt":"Verifique o sensor do tubo de sementes e a linha para ver por que as sementes não estão sendo contadas."}],"mod_en":"Seed Monitor Module"},{"id":133,"msg_en":"SMM Seed Sensor Rate Low","module_es":"Módulo monitor de semillas (SMM)","module_pt":"Módulo monitor de sementes (SMM)","msg_es":"SMM dosis baja en sensor de semillas","msg_pt":"SMM taxa baixa no sensor de sementes","nums":["162"],"causes":[{"cause_es":"La dosis medida en uno o más sensores de semillas está por debajo del límite de alarma.","cause_pt":"A taxa medida em um ou mais sensores de sementes está abaixo do limite de alarme.","fix_es":"Revise que el sensor del tubo de semillas no esté estrangulado ni tapado.","fix_pt":"Verifique se o sensor do tubo de sementes não está estrangulado ou entupido."}],"mod_en":"Seed Monitor Module"},{"id":134,"msg_en":"SMM Seed Sensor Rate High","module_es":"Módulo monitor de semillas (SMM)","module_pt":"Módulo monitor de sementes (SMM)","msg_es":"SMM dosis alta en sensor de semillas","msg_pt":"SMM taxa alta no sensor de sementes","nums":["163"],"causes":[{"cause_es":"La dosis medida en uno o más sensores de semillas está por encima del límite de alarma.","cause_pt":"A taxa medida em um ou mais sensores de sementes está acima do limite de alarme.","fix_es":"Revise el sensor del tubo de semillas y la línea para ver qué causa la dosis alta (real o aparente).","fix_pt":"Verifique o sensor do tubo de sementes e a linha para ver o que causa a taxa alta (real ou aparente)."}],"mod_en":"Seed Monitor Module"},{"id":135,"msg_en":"SMM Sensor Configuration Error","module_es":"Módulo monitor de semillas (SMM)","module_pt":"Módulo monitor de sementes (SMM)","msg_es":"SMM error de configuración de sensores","msg_pt":"SMM erro de configuração dos sensores","nums":["166"],"causes":[{"cause_es":"La configuración actual no coincide con la guardada en memoria: hay sensores detectados que no están en la configuración, o sensores configurados que no se detectan.","cause_pt":"A configuração atual não confere com a salva na memória: há sensores detectados que não estão na configuração, ou sensores configurados que não são detectados.","fix_es":"Revise el cableado y los conectores de los sensores de semillas y que la configuración coincida con la del monitor.","fix_pt":"Verifique a fiação e os conectores dos sensores de sementes e se a configuração confere com a do monitor."}],"mod_en":"Seed Monitor Module"},{"id":136,"msg_en":"SMM Voltage Error","module_es":"Módulo monitor de semillas (SMM)","module_pt":"Módulo monitor de sementes (SMM)","msg_es":"SMM error de voltaje","msg_pt":"SMM erro de tensão","nums":["168"],"causes":[{"cause_es":"El módulo detectó un voltaje de alimentación alto o bajo.","cause_pt":"O módulo detectou tensão de alimentação alta ou baixa.","fix_es":"Mida el voltaje de alimentación en el módulo y verifique que esté dentro de lo especificado.","fix_pt":"Meça a tensão de alimentação no módulo e verifique se está dentro do especificado."}],"mod_en":"Seed Monitor Module"},{"id":137,"msg_en":"BIN LOW - CHANNEL X SENSOR","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"TOLVA BAJA - SENSOR CANAL X","msg_pt":"DEPÓSITO BAIXO - SENSOR CANAL X","nums":["188","189","190","191","192"],"causes":[{"cause_es":"El sensor de nivel del depósito del canal detectó nivel bajo.","cause_pt":"O sensor de nível do depósito do canal detectou nível baixo.","fix_es":"Si todo funciona bien, solo recargue el depósito. Si la alarma es falsa por un sensor dañado, desconecte el sensor.","fix_pt":"Se tudo estiver funcionando, apenas reabasteça o depósito. Se o alarme for falso por sensor com defeito, desconecte o sensor."}],"mod_en":"5 Channel Dry Control Module"},{"id":138,"msg_en":"Channel X conveyor control valve faulted. Cycle power on the system to reset.","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"Válvula de control del transportador del canal X en falla. Apague y vuelva a encender el sistema para reiniciar.","msg_pt":"Válvula de controle da esteira do canal X em falha. Desligue e ligue o sistema para reiniciar.","nums":["181","182","183","184","185"],"causes":[{"cause_es":"Errores repetidos de Error 181–185, Cause 5 o Cause 6 pusieron el módulo en modo seguro.","cause_pt":"Erros repetidos de Error 181–185, Cause 5 ou Cause 6 colocaram o módulo em modo de segurança.","fix_es":"Apague y vuelva a encender el sistema para reiniciar la falla. Luego revise el cableado y la válvula de control.","fix_pt":"Desligue e ligue o sistema para reiniciar a falha. Depois verifique a fiação e a válvula de controle."}],"mod_en":"5 Channel Dry Control Module"},{"id":139,"msg_en":"Channel X conveyor control valve protection tripped. Check cabling and control valve.","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"Protección de la válvula de control del transportador del canal X activada. Revise el cableado y la válvula de control.","msg_pt":"Proteção da válvula de controle da esteira do canal X acionada. Verifique a fiação e a válvula de controle.","nums":["181","182","183","184","185"],"causes":[{"cause_es":"Falla de hardware al ABRIR la válvula (por temperatura, sobrecorriente, etc.). No siempre se detecta.","cause_pt":"Falha de hardware ao ABRIR a válvula (por temperatura, sobrecorrente, etc.). Nem sempre é detectada.","fix_es":"Revise si la línea de apertura está en corto a masa o la línea de cierre en corto a positivo. Si el cableado está bien, el módulo puede estar en un lugar muy caliente o estar fallando. Verifique también las conexiones de alimentación de potencia y masa del módulo.","fix_pt":"Verifique se a linha de abertura está em curto com o terra ou a linha de fechamento em curto com o positivo. Se a fiação estiver boa, o módulo pode estar em local muito quente ou com defeito. Verifique também as conexões de alimentação de potência e terra do módulo."},{"cause_es":"Falla de hardware al CERRAR la válvula (por temperatura, sobrecorriente, etc.). No siempre se detecta.","cause_pt":"Falha de hardware ao FECHAR a válvula (por temperatura, sobrecorrente, etc.). Nem sempre é detectada.","fix_es":"Revise si la línea de cierre está en corto a masa o la línea de apertura en corto a positivo. Si el cableado está bien, el módulo puede estar en un lugar muy caliente o estar fallando. Verifique también las conexiones de alimentación de potencia y masa del módulo.","fix_pt":"Verifique se a linha de fechamento está em curto com o terra ou a linha de abertura em curto com o positivo. Se a fiação estiver boa, o módulo pode estar em local muito quente ou com defeito. Verifique também as conexões de alimentação de potência e terra do módulo."}],"mod_en":"5 Channel Dry Control Module"},{"id":140,"msg_en":"Channel X conveyor drive failure. Check module for proper operation.","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"Falla del driver del transportador del canal X. Revise que el módulo funcione bien.","msg_pt":"Falha do driver da esteira do canal X. Verifique se o módulo funciona corretamente.","nums":["181","182","183","184","185"],"causes":[{"cause_es":"Se detectan más de 2 A en el puente H con la válvula en reposo durante dos segundos seguidos.","cause_pt":"Detectados mais de 2 A na ponte H com a válvula em repouso por dois segundos seguidos.","fix_es":"Indica falla del driver: reemplace el módulo. Para confirmar, mida el voltaje de salida del módulo con la válvula sin activar; debe ser cero.","fix_pt":"Indica falha do driver: substitua o módulo. Para confirmar, meça a tensão de saída do módulo com a válvula desativada; deve ser zero."}],"mod_en":"5 Channel Dry Control Module"},{"id":141,"msg_en":"Channel X conveyor over current condition. Check cabling and control valve for proper operation.","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"Sobrecorriente en el transportador del canal X. Revise el cableado y la válvula de control.","msg_pt":"Sobrecorrente na esteira do canal X. Verifique a fiação e a válvula de controle.","nums":["181","182","183","184","185"],"causes":[{"cause_es":"Se detectan más de 6 A en el puente H mientras se controla la válvula, durante dos segundos seguidos.","cause_pt":"Detectados mais de 6 A na ponte H enquanto a válvula é controlada, por dois segundos seguidos.","fix_es":"Revise que el cable de alimentación de la válvula no esté apretado ni en corto a masa. Si el cable está bien, la válvula puede estar fallando y consumiendo demasiada corriente.","fix_pt":"Verifique se o fio de alimentação da válvula não está prensado ou em curto com o terra. Se o fio estiver bom, a válvula pode estar com defeito e puxando corrente demais."}],"mod_en":"5 Channel Dry Control Module"},{"id":142,"msg_en":"CHANNEL X CONVEYOR RPM MAXIMUM LIMIT EXCEEDED","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"CANAL X: TRANSPORTADOR SUPERÓ EL LÍMITE MÁXIMO DE RPM","msg_pt":"CANAL X: ESTEIRA ULTRAPASSOU O LIMITE MÁXIMO DE RPM","nums":["176","177","178","179","180"],"causes":[{"cause_es":"El transportador gira a las RPM máximas: la compuerta de alimentación no está suficientemente abierta para la dosis actual.","cause_pt":"A esteira está girando na RPM máxima: a comporta de alimentação não está aberta o suficiente para a dose atual.","fix_es":"Si todo funciona bien, abra más la compuerta de alimentación del transportador.","fix_pt":"Se tudo estiver funcionando, abra mais a comporta de alimentação da esteira."}],"mod_en":"5 Channel Dry Control Module"},{"id":143,"msg_en":"CONVEYOR NOT RESPONDING - CHANNEL X","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"TRANSPORTADOR NO RESPONDE - CANAL X","msg_pt":"ESTEIRA NÃO RESPONDE - CANAL X","nums":["169","170","171","172","173"],"causes":[{"cause_es":"El módulo no logra que la velocidad medida del transportador iguale la pedida.","cause_pt":"O módulo não consegue fazer a velocidade medida da esteira igualar a solicitada.","fix_es":"Revise que el cableado a la válvula de control del transportador no esté dañado. Verifique que el sensor de velocidad del transportador funcione y que su cable no esté dañado.","fix_pt":"Verifique se a fiação da válvula de controle da esteira não está danificada. Verifique se o sensor de velocidade da esteira funciona e se o cabo não está danificado."}],"mod_en":"5 Channel Dry Control Module"},{"id":144,"msg_en":"CONVEYOR RUNNING WHILE TURNED OFF – CHANNEL X","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"TRANSPORTADOR GIRANDO CON EL CANAL APAGADO – CANAL X","msg_pt":"ESTEIRA GIRANDO COM O CANAL DESLIGADO – CANAL X","nums":["169","170","171","172","173"],"causes":[{"cause_es":"El módulo no logra detener el transportador (la velocidad medida no llega a cero).","cause_pt":"O módulo não consegue parar a esteira (a velocidade medida não chega a zero).","fix_es":"Revise que el cableado a la válvula de control del transportador no esté dañado y que la válvula funcione.","fix_pt":"Verifique se a fiação da válvula de controle da esteira não está danificada e se a válvula funciona."}],"mod_en":"5 Channel Dry Control Module"},{"id":145,"msg_en":"SPINNER NOT RESPONDING","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"DISCO ESPARCIDOR NO RESPONDE","msg_pt":"DISCO ESPALHADOR NÃO RESPONDE","nums":["174","175"],"causes":[{"cause_es":"El módulo no logra que la velocidad medida del disco 1 iguale la pedida.","cause_pt":"O módulo não consegue fazer a velocidade medida do disco 1 igualar a solicitada.","fix_es":"Verifique que el sensor de velocidad del disco 1 funcione y que su cable no esté dañado. Revise también el cableado a la válvula de control del disco 1.","fix_pt":"Verifique se o sensor de velocidade do disco 1 funciona e se o cabo não está danificado. Verifique também a fiação da válvula de controle do disco 1."},{"cause_es":"El módulo no logra que la velocidad medida del disco 2 iguale la pedida.","cause_pt":"O módulo não consegue fazer a velocidade medida do disco 2 igualar a solicitada.","fix_es":"Verifique que el sensor de velocidad del disco 2 funcione y que su cable no esté dañado. Revise también el cableado a la válvula de control del disco 2.","fix_pt":"Verifique se o sensor de velocidade do disco 2 funciona e se o cabo não está danificado. Verifique também a fiação da válvula de controle do disco 2."}],"mod_en":"5 Channel Dry Control Module"},{"id":146,"msg_en":"Spinner X driver failure. Check module for proper operation.","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"Falla del driver del disco X. Revise que el módulo funcione bien.","msg_pt":"Falha do driver do disco X. Verifique se o módulo funciona corretamente.","nums":["186","187"],"causes":[{"cause_es":"Se detectan más de 2 A en el puente H con la válvula en reposo durante dos segundos seguidos.","cause_pt":"Detectados mais de 2 A na ponte H com a válvula em repouso por dois segundos seguidos.","fix_es":"Indica falla del driver: reemplace el módulo. Para confirmar, mida el voltaje de salida del módulo con la válvula sin activar; debe ser cero.","fix_pt":"Indica falha do driver: substitua o módulo. Para confirmar, meça a tensão de saída do módulo com a válvula desativada; deve ser zero."}],"mod_en":"5 Channel Dry Control Module"},{"id":147,"msg_en":"Spinner X over current condition. Check cabling and control valve for proper operation.","module_es":"Módulo de control de sólidos de 5 canales","module_pt":"Módulo de controle de sólidos de 5 canais","msg_es":"Sobrecorriente en el disco X. Revise el cableado y la válvula de control.","msg_pt":"Sobrecorrente no disco X. Verifique a fiação e a válvula de controle.","nums":["186","187"],"causes":[{"cause_es":"Se detectan más de 6 A en el puente H mientras se controla la válvula, durante dos segundos seguidos.","cause_pt":"Detectados mais de 6 A na ponte H enquanto a válvula é controlada, por dois segundos seguidos.","fix_es":"Revise que el cable de alimentación de la válvula no esté apretado ni en corto a masa. Si el cable está bien, la válvula puede estar fallando y consumiendo demasiada corriente.","fix_pt":"Verifique se o fio de alimentação da válvula não está prensado ou em curto com o terra. Se o fio estiver bom, a válvula pode estar com defeito e puxando corrente demais."}],"mod_en":"5 Channel Dry Control Module"},{"id":148,"msg_en":"Bad Data - Sensor n","module_es":"Módulo maestro OptRx","module_pt":"Módulo mestre OptRx","msg_es":"Datos incorrectos - Sensor n","msg_pt":"Dados incorretos - Sensor n","nums":["194"],"causes":[{"cause_es":"El sensor de cultivo está demasiado cerca del cultivo o no detecta cultivo (por ejemplo, al pasar por caminos). No se puede calcular un índice de vegetación preciso.","cause_pt":"O sensor de cultura está muito perto da cultura ou não detecta cultura (por exemplo, ao passar por estradas). Não é possível calcular um índice de vegetação preciso.","fix_es":"Verifique la altura del sensor sobre el cultivo. Si está pasando por un camino o zona sin cultivo, la alarma es normal.","fix_pt":"Verifique a altura do sensor sobre a cultura. Se estiver passando por estrada ou área sem cultura, o alarme é normal."}],"mod_en":"OptRx Master Module"},{"id":149,"msg_en":"Crop Sensor Failed","module_es":"Módulo maestro OptRx","module_pt":"Módulo mestre OptRx","msg_es":"Falla del sensor de cultivo","msg_pt":"Falha do sensor de cultura","nums":["195"],"causes":[{"cause_es":"El sensor de cultivo detectó una falla interna, por ejemplo voltaje de alimentación bajo.","cause_pt":"O sensor de cultura detectou uma falha interna, por exemplo tensão de alimentação baixa.","fix_es":"Revise la alimentación, el cable y los conectores del sensor.","fix_pt":"Verifique a alimentação, o cabo e os conectores do sensor."}],"mod_en":"OptRx Master Module"},{"id":150,"msg_en":"Crop Sensor Lost Communication","module_es":"Módulo maestro OptRx","module_pt":"Módulo mestre OptRx","msg_es":"Sensor de cultivo perdió comunicación","msg_pt":"Sensor de cultura perdeu comunicação","nums":["196"],"causes":[{"cause_es":"Un sensor de cultivo dejó de responder al módulo maestro OptRx en la línea de comunicación serie.","cause_pt":"Um sensor de cultura parou de responder ao módulo mestre OptRx na linha de comunicação serial.","fix_es":"Revise el cable y los conectores entre el sensor y el módulo maestro OptRx.","fix_pt":"Verifique o cabo e os conectores entre o sensor e o módulo mestre OptRx."}],"mod_en":"OptRx Master Module"},{"id":151,"msg_en":"Down Force Not Responding","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Fuerza descendente (Down Force) no responde","msg_pt":"Pressão de linha (Down Force) não responde","nums":["200"],"causes":[{"cause_es":"Se ajusta la fuerza aplicada y la fuerza medida no cambia. Esta alarma no se usa: la cubre la alarma de carga en ruedas limitadoras.","cause_pt":"A força aplicada é ajustada e a força medida não muda. Este alarme não é usado: é coberto pelo alarme de carga nas rodas limitadoras.","fix_es":"Siga las indicaciones de la alarma de carga en ruedas limitadoras.","fix_pt":"Siga as orientações do alarme de carga nas rodas limitadoras."}],"mod_en":"Down Force Module"},{"id":152,"msg_en":"Gauge Wheel Load Alarm","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Alarma de carga en ruedas limitadoras","msg_pt":"Alarme de carga nas rodas limitadoras","nums":["198"],"causes":[{"cause_es":"La carga en las ruedas limitadoras quedó por debajo del mínimo para mantener buen contacto con el suelo durante 10 segundos.","cause_pt":"A carga nas rodas limitadoras ficou abaixo do mínimo para manter bom contato com o solo por 10 segundos.","fix_es":"Verifique la configuración de Fuerza descendente (Down Force) y la presión hidráulica.","fix_pt":"Verifique a configuração de Pressão de linha (Down Force) e a pressão hidráulica."}],"mod_en":"Down Force Module"},{"id":153,"msg_en":"Hydraulic Pressure Too Low","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Presión hidráulica demasiado baja","msg_pt":"Pressão hidráulica muito baixa","nums":["204"],"causes":[{"cause_es":"El tractor no entrega suficiente presión hidráulica para que el sistema funcione bien.","cause_pt":"O trator não está fornecendo pressão hidráulica suficiente para o sistema funcionar bem.","fix_es":"Verifique que el hidráulico esté bien conectado y activado.","fix_pt":"Verifique se o hidráulico está bem conectado e acionado."}],"mod_en":"Down Force Module"},{"id":154,"msg_en":"Load Pin Type Not Supported","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Tipo de perno de carga no compatible","msg_pt":"Tipo de pino de carga não compatível","nums":["216"],"causes":[{"cause_es":"En el monitor se eligió un tipo de perno de carga que no todos los módulos de línea admiten.","cause_pt":"No monitor foi escolhido um tipo de pino de carga que nem todos os módulos de linha suportam.","fix_es":"Verifique que esté seleccionado el tipo de perno de carga correcto. Si lo está, puede ser necesario cambiar uno o más módulos de línea por una versión más nueva.","fix_pt":"Verifique se o tipo de pino de carga correto está selecionado. Se estiver, pode ser necessário trocar um ou mais módulos de linha por uma versão mais nova."}],"mod_en":"Down Force Module"},{"id":155,"msg_en":"Pressure Sensor Failure","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Falla del sensor de presión","msg_pt":"Falha do sensor de pressão","nums":["202"],"causes":[{"cause_es":"El módulo de Fuerza descendente (Down Force) determinó que falló un sensor de presión. El número de canal (byte 5) indica cuál.","cause_pt":"O módulo de Pressão de linha (Down Force) determinou que um sensor de pressão falhou. O número do canal (byte 5) indica qual.","fix_es":"Revise el sensor de presión de ese canal, su cable y conectores.","fix_pt":"Verifique o sensor de pressão desse canal, seu cabo e conectores."}],"mod_en":"Down Force Module"},{"id":156,"msg_en":"Row Module Communication Failure","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Falla de comunicación del módulo de línea","msg_pt":"Falha de comunicação do módulo de linha","nums":["199"],"causes":[{"cause_es":"Un módulo de línea dejó de comunicarse en el bus CAN local por más de 3 segundos.","cause_pt":"Um módulo de linha parou de se comunicar no barramento CAN local por mais de 3 segundos.","fix_es":"Revise el cable y los conectores CAN del módulo de línea.","fix_pt":"Verifique o cabo e os conectores CAN do módulo de linha."}],"mod_en":"Down Force Module"},{"id":157,"msg_en":"Row Module Failure","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Falla del módulo de línea","msg_pt":"Falha do módulo de linha","nums":["201"],"causes":[{"cause_es":"El autodiagnóstico de un módulo de línea determinó que falló.","cause_pt":"O autodiagnóstico de um módulo de linha determinou que ele falhou.","fix_es":"Apague y vuelva a encender el sistema. Si se repite, reemplace el módulo de línea.","fix_pt":"Desligue e ligue o sistema. Se repetir, substitua o módulo de linha."}],"mod_en":"Down Force Module"},{"id":158,"msg_en":"Row Module Mismatch","module_es":"Módulo de Fuerza descendente (Down Force)","module_pt":"Módulo de Pressão de linha (Down Force)","msg_es":"Módulos de línea no coinciden","msg_pt":"Módulos de linha não conferem","nums":["203"],"causes":[{"cause_es":"La configuración enviada por el monitor no coincide con los módulos de línea que detectó el módulo.","cause_pt":"A configuração enviada pelo monitor não confere com os módulos de linha detectados pelo módulo.","fix_es":"Verifique la configuración de líneas en el monitor y la conexión de los módulos de línea.","fix_pt":"Verifique a configuração de linhas no monitor e a conexão dos módulos de linha."}],"mod_en":"Down Force Module"},{"id":159,"msg_en":"Auxiliary Valve Error","module_es":"Módulo de manejo de agua","module_pt":"Módulo de manejo de água","msg_es":"Error de válvula auxiliar","msg_pt":"Erro de válvula auxiliar","nums":["207"],"causes":[{"cause_es":"Problema con la válvula de control de inclinación o la válvula de control del bastidor de ruedas.","cause_pt":"Problema na válvula de controle de inclinação ou na válvula de controle do chassi das rodas.","fix_es":"Revise esas válvulas y su cableado.","fix_pt":"Verifique essas válvulas e sua fiação."}],"mod_en":"Water Management Module"},{"id":160,"msg_en":"GPS Quality Error","module_es":"Módulo de manejo de agua","module_pt":"Módulo de manejo de água","msg_es":"Error de calidad GPS","msg_pt":"Erro de qualidade do GPS","nums":["206"],"causes":[{"cause_es":"Algún dato de calidad GPS (Fix, VDOP, HDOP, satélites, distancia a la base) no es suficiente para trabajar con precisión.","cause_pt":"Algum dado de qualidade do GPS (Fix, VDOP, HDOP, satélites, distância à base) não é suficiente para trabalhar com precisão.","fix_es":"Verifique la señal y la corrección del GPS; espere a que mejore la calidad antes de continuar.","fix_pt":"Verifique o sinal e a correção do GPS; espere a qualidade melhorar antes de continuar."}],"mod_en":"Water Management Module"},{"id":161,"msg_en":"GPS Rate Error","module_es":"Módulo de manejo de agua","module_pt":"Módulo de manejo de água","msg_es":"Error de frecuencia GPS","msg_pt":"Erro de frequência do GPS","nums":["209"],"causes":[{"cause_es":"La frecuencia de actualización del GPS no es suficiente para trabajar con precisión.","cause_pt":"A frequência de atualização do GPS não é suficiente para trabalhar com precisão.","fix_es":"Verifique la configuración de frecuencia de salida del receptor GPS.","fix_pt":"Verifique a configuração de frequência de saída do receptor GPS."}],"mod_en":"Water Management Module"},{"id":162,"msg_en":"High Power Voltage Low","module_es":"Módulo de manejo de agua","module_pt":"Módulo de manejo de água","msg_es":"Voltaje de potencia bajo","msg_pt":"Tensão de potência baixa","nums":["210"],"causes":[{"cause_es":"El voltaje de potencia en el módulo está bajo o no llega.","cause_pt":"A tensão de potência no módulo está baixa ou não está chegando.","fix_es":"Revise la alimentación de potencia del módulo: fusible, cable y conexiones.","fix_pt":"Verifique a alimentação de potência do módulo: fusível, cabo e conexões."}],"mod_en":"Water Management Module"},{"id":163,"msg_en":"Pitch Control Error","module_es":"Módulo de manejo de agua","module_pt":"Módulo de manejo de água","msg_es":"Error de control de inclinación","msg_pt":"Erro de controle de inclinação","nums":["205"],"causes":[{"cause_es":"El módulo intenta cambiar la inclinación y la inclinación no cambia.","cause_pt":"O módulo tenta mudar a inclinação e a inclinação não muda.","fix_es":"Revise la válvula de control de inclinación, el hidráulico y el cableado.","fix_pt":"Verifique a válvula de controle de inclinação, o hidráulico e a fiação."}],"mod_en":"Water Management Module"},{"id":164,"msg_en":"Profile Data Not Received Error","module_es":"Módulo de manejo de agua","module_pt":"Módulo de manejo de água","msg_es":"Error: no se recibieron datos del perfil","msg_pt":"Erro: dados do perfil não recebidos","nums":["208"],"causes":[{"cause_es":"El monitor no envió los datos del perfil al módulo. El módulo no puede continuar.","cause_pt":"O monitor não enviou os dados do perfil ao módulo. O módulo não pode continuar.","fix_es":"Verifique que haya un perfil cargado en el monitor y la conexión con el módulo.","fix_pt":"Verifique se há um perfil carregado no monitor e a conexão com o módulo."}],"mod_en":"Water Management Module"}];

function renderBrand(){
  const b = BRANDS[tab];

  let html = `<div class="search">
    <input id="q" type="search" placeholder="${esc(L(UI.search))}" value="${esc(q)}" autocomplete="off">
    <label class="toggle"><input id="adv" type="checkbox" ${adv?"checked":""}> ${esc(L(UI.adv))}</label>
  </div>
  <div class="model"><h2>${esc(b.name)}</h2><p>${esc(b.model)}</p></div>
  <div class="seg" role="tablist"><button id="v-tasks" data-v="tasks" aria-selected="${view==="tasks"}">${esc(L(UI.tasks))}</button><button id="v-probs" data-v="probs" aria-selected="${view==="probs"}">${esc(L(UI.probs))} <span class="cnt">${PROBLEMS.filter(p=>p.brand===tab).length}</span></button></div>`;
  if(view==="probs"){ renderProblems(html, fq); return; }

    html += `<p class="keys-h">${esc(L(UI.keys))}</p><div class="keys">${KEYVALS[tab].map(k=>`<div class="key"><b>${esc(k[1])}</b><span>${esc(L(k[0]))}</span></div>`).join("")}</div>`;

  for(const c of b.cats){

    html += `<section class="cat"><h3>${esc(L(CATS[c]))}</h3><div class="grid">${gs.map(card).join("")}</div></section>`;
  }

}
function renderProblems(html, fq){

    ${p.err?`<button class="plink err" data-goerr="${esc(p.err)}">${esc(L(UI.seeErr))}: ${esc(p.err)} →</button>`:""}</div></div></details>`).join("") || `<p class="empty">${esc(L(UI.none))}</p>`;

const origIdx = (g,i) => g._o ? g._o[i] : i;
const imgs = (g,i) => { const oi=origIdx(g,i); if(oi==null) return []; const v=(IMGS[g.id]||{})[oi]; return v ? (Array.isArray(v)?v:[v]) : []; };

function renderErrors(){
  const fq = fold(q);
  const mods = [...new Set(ERRORS.map(e=>e.mod_en))];
  const list = ERRORS.filter(e=>(!errMod||e.mod_en===errMod) && (!fq || fold([e.msg_en,e.msg_es,e.msg_pt,e.nums.join(" "),e.module_es,e.module_pt].join(" ")).includes(fq) || e.nums.includes(q.trim())));
  const modName = m => { const e=ERRORS.find(x=>x.mod_en===m); return lang==="es"?e.module_es:e.module_pt; };
  let html = `<div class="search"><input id="q" type="search" inputmode="search" placeholder="${esc(L(UI.searchErr))}" value="${esc(q)}" autocomplete="off"></div>

  if(had){ const i=$("q"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }

function notes(g){

function renderViewer(){
  const g = cur, n = g.steps.length;

  let h = `<p class="intro">${esc(L(g.intro))}</p>`;
  if(g.note) h += `<div class="note n"><b>${esc(L(UE.fNote))}</b><span>${esc(L(g.note)).replace(/\n/g,"<br>")}</span></div>`;
  if(listMode){
    h += `<div class="list">${g.steps.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div class="sc"><p>${esc(L(s))}</p>${pic(g,i)}</div></div>`).join("")}</div>${notes(g)}`;
  } else {
    h += `<div class="progress">${g.steps.map((_,i)=>`<i class="${i<=idx?"on":""}" data-i="${i}" title="${i+1}"></i>`).join("")}</div>
    <div class="steplabel">${esc(L(UI.step))} ${idx+1} ${esc(L(UI.of))} ${n}</div>
    <div class="step"><span class="num">${idx+1}</span><div class="sc"><p>${esc(L(g.steps[idx]))}</p>${pic(g,idx)}</div></div>`;
    if(imgs(g,idx).length) h += `<p class="hint">${esc(L(UI.zoom))}</p>`;
    if(idx===n-1 || (g.warn&&idx===0)) h += notes(g);
  }
  h += `<p class="src">${esc(L(UI.source))}: ${esc(g.src)}${g._by?` · ${esc(L(UE.editedBy))} ${esc(g._by)}${g._at?" ("+g._at.toLocaleDateString(lang==="es"?"es-PY":"pt-BR")+")":""}`:""}</p>`;
  $("vInner").innerHTML = h;
  $("vFoot").hidden = listMode;
  $("vPrev").textContent = L(UI.prev); $("vPrev").disabled = idx===0;
  $("vNext").textContent = L(idx===n-1?UI.done:UI.next);
}

const BASE = {}; GUIDES.forEach(g=>BASE[g.id]=JSON.parse(JSON.stringify(g)));
const pair = o => o ? [o.es||o.pt||"", o.pt||o.es||""] : null;
function applyEdits(){
  GUIDES.forEach((g,gi)=>{
    const b=BASE[g.id], e=EDITS[g.id];
    const n = JSON.parse(JSON.stringify(b)); n._o=null;
    if(e){
      if(e.title) n.title=pair(e.title);
      if(e.intro) n.intro=pair(e.intro);
      if(Array.isArray(e.steps)){ n.steps=e.steps.map(pair); n._o=e.steps.map(s=>Number.isInteger(s.o)?s.o:null); }
      if(Array.isArray(e.warn)) n.warn=e.warn.map(pair);
      if(Array.isArray(e.tips)) n.tips=e.tips.map(pair);
      n.note = e.note && (e.note.es||e.note.pt) ? pair(e.note) : null;
      n._by = e.byName||e.by||""; n._at = e.at && e.at.toDate ? e.at.toDate() : null;
    }
    Object.keys(g).forEach(k=>delete g[k]); Object.assign(g,n);
  });
  if(cur){ cur=GUIDES.find(x=>x.id===cur.id); if(idx>=cur.steps.length) idx=cur.steps.length-1; }

async function initFirebase(){
  try{
    const V="10.12.2", base=`https://www.gstatic.com/firebasejs/${V}/`;
    const [app, auth, fs] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    const a = app.initializeApp(FB_CONFIG);
    FB = { auth:auth.getAuth(a), db:fs.getFirestore(a), A:auth, F:fs };
    FB.F.onSnapshot(FB.F.collection(FB.db,"edits"), snap=>{
      EDITS={}; snap.forEach(d=>EDITS[d.id]=d.data()); applyEdits(); render();
    }, err=>console.warn("edits", err));
    FB.A.onAuthStateChanged(FB.auth, async u=>{
      me=u; isEditor=false; editors=[];
      if(u){
        try{ const d=await FB.F.getDoc(FB.F.doc(FB.db,"config","editors")); editors=(d.exists()&&d.data().emails)||[]; }catch(e){}
        isEditor = u.email===ADMIN_EMAIL || editors.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
      }
      renderAuth();
    });
    renderAuth();
  }catch(e){ console.warn("Firebase no disponible", e); }
}

  return `<fieldset class="eb"><legend>${esc(L(label))}</legend>${draft[key].map((it,i)=>`
    <div class="erow">${key==="steps"?`<span class="enum">${i+1}</span>`:""}<div class="ecol">${biField(key+"."+i, it, key==="steps"?3:2)}
      ${key==="steps"&&Number.isInteger(it.o)&&imgs(BASE[editId],it.o).length?`<img class="ethumb" src="img/${imgs(BASE[editId],it.o)[0]}.jpg" alt="">`:""}</div>
      <div class="ebtns"><button type="button" data-mv="${key}.${i}.-1" title="${esc(L(UE.up))}" ${i===0?"disabled":""}>▲</button><button type="button" data-mv="${key}.${i}.1" title="${esc(L(UE.down))}" ${i===draft[key].length-1?"disabled":""}>▼</button><button type="button" data-rm="${key}.${i}" title="${esc(L(UE.del))}">✕</button></div></div>`).join("")}
    <button type="button" class="eadd" data-add="${key}">${esc(L(addLabel))}</button></fieldset>`;
}
function renderEditor(){
  $("edTitle").textContent = L(UE.editing)+": "+L(BASE[editId].title);
  const edited = !!EDITS[editId];
  $("edBody").innerHTML = `<p class="ehelp">${esc(L(UE.help))}</p>
    <fieldset class="eb"><legend>${esc(L(UE.fTitle))}</legend>${biField("title",draft.title)}</fieldset>
    <fieldset class="eb"><legend>${esc(L(UE.fIntro))}</legend>${biField("intro",draft.intro,2)}</fieldset>
    ${listBlock("steps",UE.fSteps,UE.addStep)}${listBlock("warn",UE.fWarn,UE.addWarn)}${listBlock("tips",UE.fTips,UE.addTip)}
    <fieldset class="eb note-eb"><legend>${esc(L(UE.fNote))}</legend>${biField("note",draft.note,3)}</fieldset>
    ${edited?`<button type="button" class="erestore" id="edRestore">${esc(L(UE.restore))}</button>`:""}`;
  $("edSave").textContent=L(UE.save); $("edCancel").textContent=L(UE.cancel);
}
function setPath(path, lg, val){
  const [k,i]=path.split("."); if(i===undefined) draft[k][lg]=val; else draft[k][+i][lg]=val;
}
async function saveEditor(){
  const clean = a => a.filter(x=>(x.es||"").trim()||(x.pt||"").trim()).map(x=>({es:x.es.trim(), pt:x.pt.trim(), ...(Object.prototype.hasOwnProperty.call(x,"o")?{o:Number.isInteger(x.o)?x.o:null}:{})}));
  const data = { title:{es:draft.title.es.trim(),pt:draft.title.pt.trim()}, intro:{es:draft.intro.es.trim(),pt:draft.intro.pt.trim()},
    steps:clean(draft.steps), warn:clean(draft.warn), tips:clean(draft.tips), note:{es:draft.note.es.trim(),pt:draft.note.pt.trim()},
    by: me.email, byName: me.displayName||me.email, at: FB.F.serverTimestamp() };
  if(!data.steps.length){ toast(L(UE.err)); return; }
  $("edSave").disabled=true;
  try{
    await FB.F.setDoc(FB.F.doc(FB.db,"edits",editId), data);
    try{ await FB.F.addDoc(FB.F.collection(FB.db,"history"), {...data, guide:editId}); }catch(e){}
    $("editor").hidden=true; toast(L(UE.saved));
  }catch(e){ console.warn(e); toast(L(UE.err)+": "+(e.code==="permission-denied"?L(UE.noPerm):e.message)); }
  $("edSave").disabled=false;
}
async function restoreOriginal(){
  const b=$("edRestore"); if(!b.dataset.ok){ b.dataset.ok="1"; b.textContent=L(UE.confirmRestore); return; }
  try{
    await FB.F.deleteDoc(FB.F.doc(FB.db,"edits",editId));
    try{ await FB.F.addDoc(FB.F.collection(FB.db,"history"), {guide:editId, restored:true, by:me.email, at:FB.F.serverTimestamp()}); }catch(e){}
    $("editor").hidden=true; toast(L(UE.restored));
  }catch(e){ toast(L(UE.err)+": "+e.message); }
}
// ---- equipo (admin) ----
function renderTeam(){
  $("edTitle").textContent=L(UE.teamTitle);
  $("edBody").innerHTML = `<p class="ehelp">${esc(L(UE.teamHelp))}</p>
    <ul class="team">${editors.map((m,i)=>`<li><span>${esc(m)}</span><button type="button" data-rmed="${i}">✕</button></li>`).join("")}</ul>
    <div class="teamadd"><input id="teamEmail" type="email" placeholder="tecnico@gmail.com" autocomplete="off"><button type="button" id="teamAdd">${esc(L(UE.add))}</button></div>`;
  $("edSave").textContent=L(UE.save); $("edCancel").textContent=L(UE.close);
}
let teamMode=false;
async function saveTeam(){
  try{ await FB.F.setDoc(FB.F.doc(FB.db,"config","editors"), {emails:editors}); $("editor").hidden=true; teamMode=false; toast(L(UE.saved)); }
  catch(e){ toast(L(UE.err)+": "+e.message); }
}
// ---- eventos ----
document.addEventListener("click", async e=>{
  if(e.target.id==="authBtn"){
    if(!me){ try{ await FB.A.signInWithPopup(FB.auth, new FB.A.GoogleAuthProvider()); }catch(err){ console.warn(err); } }
    else { renderAuthMenu(); $("authMenu").hidden=!$("authMenu").hidden; }
    return;
  }
  if(e.target.id==="logoutBtn"){ $("authMenu").hidden=true; await FB.A.signOut(FB.auth); return; }
  if(e.target.id==="teamBtn"){ $("authMenu").hidden=true; teamMode=true; $("editor").hidden=false; renderTeam(); return; }
  if(!e.target.closest("#authMenu") && !$("authMenu").hidden) $("authMenu").hidden=true;
  if(e.target.id==="vEdit"){ teamMode=false; openEditor(); return; }
  if(e.target.id==="edCancel"){ $("editor").hidden=true; teamMode=false; return; }
  if(e.target.id==="edSave"){ teamMode?saveTeam():saveEditor(); return; }
  if(e.target.id==="edRestore"){ restoreOriginal(); return; }
  if(e.target.id==="teamAdd"){ const v=$("teamEmail").value.trim().toLowerCase(); if(v && v.includes("@") && !editors.includes(v)){ editors.push(v); renderTeam(); } return; }
  const rmed=e.target.closest("[data-rmed]"); if(rmed){ editors.splice(+rmed.dataset.rmed,1); renderTeam(); return; }
  const mv=e.target.closest("[data-mv]"); if(mv){ const [k,i,d]=mv.dataset.mv.split("."); const a=draft[k], j=+i+(+d); [a[+i],a[j]]=[a[j],a[+i]]; renderEditor(); return; }
  const rm=e.target.closest("[data-rm]"); if(rm){ const [k,i]=rm.dataset.rm.split("."); draft[k].splice(+i,1); renderEditor(); return; }
  const ad=e.target.closest("[data-add]"); if(ad){ const k=ad.dataset.add; draft[k].push(k==="steps"?{es:"",pt:"",o:null}:blank()); renderEditor(); const els=$("edBody").querySelectorAll(`[data-p="${k}.${draft[k].length-1}"]`); if(els[0]) els[0].focus(); return; }
});
document.addEventListener("input", e=>{ const p=e.target.dataset&&e.target.dataset.p; if(p&&draft) setPath(p, e.target.dataset.lg, e.target.value); });

const h=(location.hash||"").slice(1);
if(["agleader","verion","errores"].includes(h)) tab=h;
render();
initFirebase();
</script>

</body>
